name: Xenia CI (unsigned build)

# Verifies that the Xenia-branded Talk desktop client builds on all three desktop
# platforms. talk-desktop is a single Electron codebase, so this one workflow serves
# XNT-61 (Windows), XNT-62 (macOS) and XNT-63 (Linux).
#
# Distribution-artifact coverage differs by platform on purpose:
#   Windows - full: MSI (WiX) + one-click EXE (Squirrel). This is XNT-61's scope.
#   macOS   - .app bundle + .zip + .dmg. Both the zip and the dmg are shippable.
#             The DMG maker used to fail on Node 23+ (appdmg -> macos-alias calls
#             util.isDate, removed in Node 23); that is fixed by
#             patches/macos-alias+0.2.11.patch, applied on install by patch-package
#             (XNT-80). `package:mac` builds every darwin target, so a regression in
#             that patch fails this job instead of going unnoticed.
#   Linux   - Flatpak (the shippable distribution artifact) + .zip. Flatpak needs
#             flatpak-builder, eu-strip and GB-scale Flathub runtimes; they are
#             installed in the Linux job below (XNT-63).
#             There is deliberately no .deb/.rpm/AppImage here: this project has no
#             makers for those formats, only maker-flatpak and maker-zip.
#
# CHANNEL=stable is set on every build job on purpose (XNT-134). The default differs
# either side of the build: forge.config.js and prepare-release-packages.mjs default to
# 'stable', but webpack.{base,renderer}.config.js default to 'dev'. Left unset, the
# artifact is named as a stable release while its renderer is compiled as a dev build,
# so getFullVersion() appends "-<hash> (<branch>)" and the login footer renders it.
# Windows was already stable via release:package's own default; it is spelled out here
# so all three jobs declare the channel the same way.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # WiX v3 ships preinstalled on windows-latest. `winget install` exits 1 when the
      # package is already present and has no upgrade, so only install if it is missing.
      - name: Set up WiX Toolset
        shell: pwsh
        run: |
          function Find-Wix {
            Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v*' -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          $wix = Find-Wix
          if (-not $wix) {
            winget install --accept-source-agreements --accept-package-agreements --disable-interactivity WiXToolset.WiXToolset
            $wix = Find-Wix
          }
          if (-not $wix) { throw 'WiX Toolset not found after install attempt' }
          $bin = Join-Path $wix.FullName 'bin'
          Write-Host "Using WiX at $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package Windows (MSI + EXE)
        env:
          CHANNEL: stable
        run: npm run release:package -- --windows

      - uses: actions/upload-artifact@v4
        with:
          name: xenia-talk-windows
          path: out/make/**
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Fetch built-in Talk
        run: |
          TALK_VERSION=$(node -p "require('./package.json').talk.stable")
          git clone --branch="$TALK_VERSION" --depth=1 https://github.com/nextcloud/spreed out/.temp/spreed
          npm ci --prefix out/.temp/spreed

      # Signing is exercised here ONLY on a manual dispatch, never on push or
      # pull_request. Two reasons. Signing plus notarisation adds minutes and a
      # round-trip to Apple's service to every run, which is not worth paying on
      # each PR. More importantly it gives somewhere to PROVE signing works that
      # does not publish anything: xenia-release.yml fires on a `v*` tag and cuts
      # a real GitHub Release that installed clients poll for updates, so testing
      # signing there means discovering a misconfiguration by shipping an unsigned
      # release to users. Dispatch this workflow first; ship second.
      - name: Import Developer ID certificate (dispatch only)
        id: signing
        if: github.event_name == 'workflow_dispatch'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          missing=""
          for key in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval "printf '%s' \"\${$key:-}\"")" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::UNSIGNED. These secrets did not resolve in this repository:$missing"
            echo "An org-level secret that exists but is not scoped to this repository resolves"
            echo "to an EMPTY STRING, not an error. Krateos-BV scopes APPLE_* by platform"
            echo "relevance and talk-desktop is cross-platform, so it may not be on the list."
            echo "Fix: org Settings -> Secrets and variables -> Actions -> secret -> Repository access."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${APPLE_CERT_PASSWORD:-}" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::Imported, but no 'Developer ID Application' identity present - the .p12 probably lacks its private key."
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS app bundle (universal)
        env:
          TALK_PATH: out/.temp/spreed
          CHANNEL: stable
          # Empty on push/PR, so hasMacosSign stays false and this is the
          # unsigned build it has always been.
          APPLE_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_ID || '' }}
          APPLE_ID_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_ID_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run build:mac

      # Proves the artifact really is signed and notarised, rather than trusting that
      # the build step did not quietly skip it. Reports only - never fails the job.
      - name: Verify signature and notarisation
        if: always() && steps.signing.outputs.signed == 'true'
        run: |
          APP="out/Xenia Talk-darwin-universal/Xenia Talk.app"
          echo "--- codesign ---";      codesign -dv --verbose=4 "$APP" 2>&1 | head -20 || true
          echo "--- strict verify ---"; codesign --verify --deep --strict --verbose=2 "$APP" 2>&1 | tail -5 || true
          echo "--- Gatekeeper ---";    spctl -a -vvv -t exec "$APP" 2>&1 | tail -5 || true
          echo "--- notarisation ticket ---"; xcrun stapler validate "$APP" 2>&1 | tail -5 || true

      # Makes every darwin distributable from the bundle built above
      # (--skip-package reuses it): .zip and .dmg.
      - name: Make macOS .zip and .dmg
        env:
          TALK_PATH: out/.temp/spreed
          CHANNEL: stable
        run: npm run package:mac

      - uses: actions/upload-artifact@v4
        with:
          name: xenia-talk-macos
          path: out/Xenia Talk-darwin-universal/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: xenia-talk-macos-zip
          path: out/make/zip/**
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: xenia-talk-macos-dmg
          path: out/make/dmg/**
          if-no-files-found: error

      # Last step in the job: the keychain must outlive build:mac (signs and
      # notarises), package:mac, and every artifact upload. always() so a failed
      # build still removes it.
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Fetch built-in Talk
        run: |
          TALK_VERSION=$(node -p "require('./package.json').talk.stable")
          git clone --branch="$TALK_VERSION" --depth=1 https://github.com/nextcloud/spreed out/.temp/spreed
          npm ci --prefix out/.temp/spreed

      # maker-flatpak shells out to flatpak-builder and eu-strip (elfutils), and
      # flatpak-builder resolves the runtime/sdk/base refs that forge.config.js pins
      # to 25.08. None of them ship on the runner, so install them before making.
      # User-scope installs keep flatpak out of sudo for everything but apt.
      - name: Set up Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # No --targets here, deliberately. --platform=linux already selects exactly the
      # makers this project configures for Linux (flatpak + zip), each keeping its
      # forge.config.js config. Naming them explicitly is a trap in both spellings:
      #   --targets=@electron-forge/maker-flatpak matches no configured maker (forge
      #     matches on Maker.name, i.e. "flatpak"), so it builds a bare MakerFlatpak
      #     with NO config - losing the Xenia app id, icon, productName, the pinned
      #     25.08 runtime and every finishArg, and silently shipping an unbranded app.
      #   --targets=zip matches the FIRST maker named "zip", which is the macOS one
      #     (platforms: darwin); the platform filter then drops it and no .zip is made.
      - name: Build and package Linux (Flatpak + zip)
        env:
          TALK_PATH: out/.temp/spreed
          CHANNEL: stable
        run: |
          npm run build:linux
          npm run package:linux

      # Belt and braces: forge throws if a maker is unsupported, but it cannot tell
      # us the .flatpak actually landed in out/make (postMake renames artifacts).
      # Assert it exists so an empty upload cannot pass as a green check.
      - name: Verify Flatpak artifact was produced
        run: |
          shopt -s globstar nullglob
          artifacts=(out/make/**/*.flatpak)
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "::error::No .flatpak artifact in out/make - the flatpak maker was skipped."
            find out/make -type f -print
            exit 1
          fi
          printf 'Flatpak artifact: %s\n' "${artifacts[@]}"

      # Install the bundle we just built and read back its exported desktop entry
      # and icon. The .flatpak looks valid either way; this is what actually proves
      # the Xenia branding reached the artifact rather than upstream's defaults.
      - name: Verify Xenia branding in the Flatpak
        run: |
          shopt -s nullglob
          flatpak install -y --user --bundle out/make/flatpak/x86_64/*.flatpak
          export_dir="$HOME/.local/share/flatpak/app/eu.xeniacloud.talk/current/active/export/share"
          desktop="$export_dir/applications/eu.xeniacloud.talk.desktop"
          echo "--- $desktop ---"
          cat "$desktop"
          grep -qx 'Name=Xenia Talk' "$desktop"
          grep -qx 'Icon=eu.xeniacloud.talk' "$desktop"
          echo "--- exported icons ---"
          find "$export_dir/icons" -type f -print
          find "$export_dir/icons" -type f -name 'eu.xeniacloud.talk.*' | grep -q . \
            || { echo "::error::No Xenia icon exported by the Flatpak"; exit 1; }
          # The description legitimately credits upstream ("based on Nextcloud Talk",
          # AGPL attribution). Any OTHER Nextcloud string is leftover branding.
          if grep -i nextcloud "$desktop" | grep -vi 'based on Nextcloud Talk'; then
            echo "::error::Unexpected Nextcloud branding in the desktop entry"
            exit 1
          fi
          echo 'OK: desktop entry and icon are Xenia-branded'

      - uses: actions/upload-artifact@v4
        with:
          name: xenia-talk-linux
          path: out/make/**
          if-no-files-found: error
