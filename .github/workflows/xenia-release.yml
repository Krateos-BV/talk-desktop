name: Xenia Release

# Cuts a GitHub Release on this fork from a version tag, with the platform artifacts
# attached. This is the release channel the in-app update checker polls
# (BUILD_CONFIG.updateRepository -> Krateos-BV/talk-desktop), so the asset filenames
# here are load-bearing: githubRelease.service.ts matches an installer by name, and a
# release whose assets are named differently is silently useless to installed clients.
#
# The build jobs mirror .github/workflows/xenia-ci.yml - same platform caveats apply
# (Flatpak needs a toolchain; macOS ships both the .zip and the .dmg). The difference is
# CHANNEL=stable, which selects the Talk version bundled (package.json talk.stable) and
# drops the channel infix from artifact names.
#
# The release is deliberately NOT marked as a prerelease: a client built with
# CHANNEL=stable only ever considers non-prerelease releases, so flagging it would hide
# the release from exactly the builds this workflow produces.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CHANNEL: stable

jobs:
  # Fail before spending three platform builds if the tag and package.json disagree.
  # They must match: the update checker compares the release tag against the running
  # build's package.json version, so a mismatch either hides the release or makes every
  # installed client believe it is permanently out of date.
  verify-tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

  build-windows:
    needs: verify-tag
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up WiX Toolset
        shell: pwsh
        run: |
          function Find-Wix {
            Get-ChildItem 'C:\Program Files (x86)' -Filter 'WiX Toolset v*' -Directory -ErrorAction SilentlyContinue |
              Sort-Object Name -Descending | Select-Object -First 1
          }
          $wix = Find-Wix
          if (-not $wix) {
            winget install --accept-source-agreements --accept-package-agreements --disable-interactivity WiXToolset.WiXToolset
            $wix = Find-Wix
          }
          if (-not $wix) { throw 'WiX Toolset not found after install attempt' }
          $bin = Join-Path $wix.FullName 'bin'
          Write-Host "Using WiX at $bin"
          $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Package Windows (MSI + EXE)
        run: npm run release:package -- --windows

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: out/make/**
          if-no-files-found: error

  build-macos:
    needs: verify-tag
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Fetch built-in Talk
        run: |
          TALK_VERSION=$(node -p "require('./package.json').talk.stable")
          git clone --branch="$TALK_VERSION" --depth=1 https://github.com/nextcloud/spreed out/.temp/spreed
          npm ci --prefix out/.temp/spreed

      # Signing is opt-in and degrades safely. With no APPLE_* secrets resolvable this
      # step reports "unsigned" and exits 0, forge.config.js's `hasMacosSign` stays false,
      # and the job produces exactly the unsigned bundle it produced before. Signing turns
      # itself on the moment the secrets resolve, with no further change here.
      #
      # Note a secret that EXISTS at org level but is not scoped to this repository
      # resolves to an empty string, not an error — that is how XNT-184's four dispatches
      # died. So "unsigned" below means "no usable secret", which covers both absent and
      # unscoped. Check the org secret's repository access before assuming it is missing.
      - name: Import Developer ID certificate
        id: signing
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -euo pipefail

          # Report EVERY unresolved key, not just the certificate. A partially-scoped
          # secret set is the nastiest case: the cert imports fine, hasMacosSign is still
          # false because a notarisation var is empty, and the job silently produces an
          # unsigned build with nothing obviously wrong. Naming the exact keys here means
          # one glance at this log distinguishes "not scoped to this repo" from "signing
          # is broken".
          missing=""
          for key in APPLE_CERT_P12 APPLE_CERT_PASSWORD APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            if [ -z "$(eval "printf '%s' \"\${$key:-}\"")" ]; then
              missing="$missing $key"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::warning::UNSIGNED BUILD. These secrets did not resolve in this repository:$missing"
            echo ""
            echo "This is the documented degrade path, not a failure."
            echo ""
            echo "An org-level secret that exists but is NOT scoped to this repository resolves"
            echo "to an EMPTY STRING, not an error (this is how XNT-184's dispatches died)."
            echo "Krateos-BV scopes the APPLE_* secrets by platform relevance, and talk-desktop"
            echo "is a cross-platform Electron repo that builds macOS, Linux and Windows - so it"
            echo "may simply not be on the selected-repositories list."
            echo ""
            echo "Check: GitHub org -> Settings -> Secrets and variables -> Actions -> the secret"
            echo "-> Repository access. Add talk-desktop if absent. No code change is needed."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Auto-lock after 6h so the key cannot outlive the job on a reused runner.
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "${APPLE_CERT_PASSWORD:-}" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this, codesign prompts for keychain access and hangs the job forever.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null

          # Prepend, don't replace: dropping the login keychain breaks unrelated tooling.
          security list-keychain -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application"; then
            echo "::error::Certificate imported but no 'Developer ID Application' identity is present."
            echo "Most likely the .p12 was exported without its private key - re-export selecting BOTH rows in Keychain Access."
            exit 1
          fi

          echo "Developer ID Application identity available; all five APPLE_* secrets resolved."
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build macOS app bundle (universal)
        env:
          TALK_PATH: out/.temp/spreed
          # forge.config.js:156 gates on these three. Empty values leave hasMacosSign
          # false, which is the unsigned path - not a failure.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run build:mac

      # Builds every darwin distributable: .zip and .dmg. The DMG maker used to fail on
      # Node 23+ (appdmg -> macos-alias util.isDate); fixed by patch-package (XNT-80).
      # Shipping the .dmg is what lets macOS clients auto-match an installer, since
      # currentInstallerExt is 'dmg' on macOS.
      - name: Make macOS .zip and .dmg
        env:
          TALK_PATH: out/.temp/spreed
        run: npm run package:mac

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: out/make/**
          if-no-files-found: error

      # Last step in the job on purpose: the keychain must outlive both `build:mac`
      # (which signs and notarises) and `package:mac` (which builds the .dmg/.zip from
      # the signed bundle). `always()` so a failed build still cleans up.
      - name: Remove signing keychain
        if: always() && steps.signing.outputs.signed == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

  build-linux:
    needs: verify-tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Fetch built-in Talk
        run: |
          TALK_VERSION=$(node -p "require('./package.json').talk.stable")
          git clone --branch="$TALK_VERSION" --depth=1 https://github.com/nextcloud/spreed out/.temp/spreed
          npm ci --prefix out/.temp/spreed

      - name: Set up Flatpak toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder elfutils
          flatpak remote-add --if-not-exists --user \
            flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.electronjs.Electron2.BaseApp//25.08

      # No --targets here, deliberately - see the note in xenia-ci.yml.
      - name: Build and package Linux (Flatpak + zip)
        env:
          TALK_PATH: out/.temp/spreed
        run: |
          npm run build:linux
          npm run package:linux

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: out/make/**
          if-no-files-found: error

  release:
    needs:
      - build-windows
      - build-macos
      - build-linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: artifacts

      # Flatten: every maker nests its output differently (squirrel.windows/x64/,
      # wix/x64/, zip/darwin/universal/, flatpak/x86_64/), and `gh release create`
      # wants plain file paths. postMake has already given each file its final name.
      - name: Collect distributables
        run: |
          mkdir -p dist
          find artifacts -type f \
            \( -name '*.msi' -o -name '*.exe' -o -name '*.zip' -o -name '*.flatpak' -o -name '*.dmg' \) \
            -exec cp -v {} dist/ \;
          ls -l dist

      # The update checker matches an asset by filename, so a rename in forge.config.js
      # or a maker silently changing its output would break updates for every installed
      # client while the release itself still looked fine. Assert the names here.
      - name: Verify asset names match what the update checker expects
        run: |
          missing=0
          for expected in \
            'Xenia.Talk-windows-x64.msi' \
            'Xenia.Talk-windows-x64.exe' \
            'Xenia.Talk-macos-universal.zip' \
            'Xenia.Talk-macos-universal.dmg' \
            'Xenia.Talk-linux-x64.flatpak' \
            'Xenia.Talk-linux-x64.zip'
          do
            if [ ! -f "dist/$expected" ]; then
              echo "::error::Missing expected release asset: $expected"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || { echo 'Produced:'; ls dist; exit 1; }
          echo 'OK: all expected assets present'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Xenia Talk $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
